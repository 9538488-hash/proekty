mats.forEach(o=>{for(let i=0;i<o.pos.length;i+=3){o.pos[i]-=ctr.x;o.pos[i+1]-=box.min.y;o.pos[i+2]-=ctr.z}});
const el=document.getElementById('v');
const R=new THREE.WebGLRenderer({antialias:true,alpha:true});R.setPixelRatio(Math.min(devicePixelRatio,2));el.appendChild(R.domElement);
const S=new THREE.Scene(),C=new THREE.PerspectiveCamera(35,1,0.05,50);
const Pv=new THREE.Group(),G=new THREE.Group();S.add(Pv);Pv.add(G);G.position.set(0,-size.y*0.45,0);
S.add(new THREE.HemisphereLight(0xffffff,0x6f757c,0.4));
const dl=new THREE.DirectionalLight(0xffffff,0.75);dl.position.set(-3,5,2);S.add(dl);
const dl2=new THREE.DirectionalLight(0xffffff,0.2);dl2.position.set(3,1,-3);S.add(dl2);
const texs=D.tex.map(s=>{const t=new THREE.TextureLoader().load(s);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.anisotropy=4;return t});
const LM=new THREE.LineBasicMaterial({color:0x2b3036,transparent:true,opacity:0.6});
const meshes=[];
mats.forEach(o=>{const m=o.m,g=new THREE.BufferGeometry();
 g.setAttribute('position',new THREE.BufferAttribute(o.pos,3));g.setAttribute('uv',new THREE.BufferAttribute(o.uv,2));g.setIndex(new THREE.BufferAttribute(o.idx,1));
 const mir=/зеркал/i.test(m.n),tx=m.tx>=0;
 const mesh=new THREE.Mesh(g,new THREE.MeshStandardMaterial({color:tx?0xffffff:m.col,map:tx?texs[m.tx]:null,roughness:mir?0.15:0.6,metalness:mir?0.3:0,flatShading:true,side:THREE.DoubleSide,polygonOffset:true,polygonOffsetFactor:1,polygonOffsetUnits:1}));
 mesh.userData.p=m.k;mesh.add(new THREE.LineSegments(new THREE.EdgesGeometry(g,40),LM));
 G.add(mesh);meshes.push(mesh)});
const chips=document.getElementById('chips'),hid=new Set();
const rb=document.createElement('button');rb.textContent='Сбросить вид';
function vis(){meshes.forEach(m=>{const g=cats[m.userData.p];m.visible=!hid.has(g);if(D.edit){m.material.emissive.setHex(TINT[g]||0);m.material.emissiveIntensity=0.4}})}
function build(){chips.innerHTML='';GL.filter(g=>meshes.some(m=>cats[m.userData.p]===g)).forEach(g=>{const l=document.createElement('label');l.className='c';const i=document.createElement('input');i.type='checkbox';i.checked=!hid.has(g);i.onchange=()=>{i.checked?hid.delete(g):hid.add(g);vis()};l.append(i,g);chips.append(l)});chips.append(rb);vis()}
build();
addEventListener('message',e=>{if(D.edit&&e.data&&e.data.t==='cats'){cats=e.data.c;build()}});
const rad=Math.max(size.x,size.y,size.z);
const q0=new THREE.Quaternion().setFromEuler(new THREE.Euler(0.3,-0.7,0)),qd=new THREE.Quaternion();Pv.quaternion.copy(q0);
let dist=rad*2.2,auto=true;const d0=dist;
function upd(){C.up.set(0,1,0);C.position.set(0,0,dist);C.lookAt(0,0,0)}
rb.onclick=()=>{Pv.quaternion.copy(q0);dist=d0};
const ptr=new Map(),rc=new THREE.Raycaster();let pd=0;
el.addEventListener('pointerdown',e=>{el.setPointerCapture(e.pointerId);ptr.set(e.pointerId,{x:e.clientX,y:e.clientY,d:0});auto=false;if(ptr.size===2){const a=[...ptr.values()];pd=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)}});
el.addEventListener('pointermove',e=>{const p=ptr.get(e.pointerId);if(!p)return;const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;p.d+=Math.abs(dx)+Math.abs(dy);
 if(ptr.size===1){Pv.quaternion.premultiply(qd.setFromEuler(new THREE.Euler(dy*0.007,dx*0.007,0)))}
 else if(ptr.size===2){const a=[...ptr.values()],d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);dist=Math.max(rad*0.4,Math.min(rad*6,dist*pd/d));pd=d}});
function pick(e){const r=el.getBoundingClientRect();rc.setFromCamera(new THREE.Vector2((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1),C);const h=rc.intersectObjects(meshes.filter(m=>m.visible),false)[0];if(h)parent.postMessage({t:'pick',p:h.object.userData.p},'*')}
const up=e=>{const p=ptr.get(e.pointerId);ptr.delete(e.pointerId);if(D.edit&&p&&p.d<5&&e.type==='pointerup')pick(e)};
el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);
el.addEventListener('wheel',e=>{e.preventDefault();auto=false;dist=Math.max(rad*0.4,Math.min(rad*6,dist*(1+e.deltaY*0.001)))},{passive:false});
function fit(){const w=el.clientWidth,h=el.clientHeight;R.setSize(w,h,false);C.aspect=w/h;C.updateProjectionMatrix()}
new ResizeObserver(fit).observe(el);fit();
(function loop(){if(auto)Pv.quaternion.premultiply(qd.setFromEuler(new THREE.Euler(0,0.003,0)));upd();R.render(S,C);requestAnimationFrame(loop)})();
</script></body></html>
